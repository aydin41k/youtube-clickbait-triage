<!doctype html><html><head><title>YouTube card fixture</title></head><body>
<ytd-rich-grid-media id="home"><a id="thumbnail" href="/watch?v=AAAAAAAAAAA&list=PLdemo"><img src="https://i.ytimg.com/vi/AAAAAAAAAAA/hqdefault.jpg?actual=1"></a><h3><a id="video-title" title="Clickbait  displayed title!" aria-label="Original native label" href="/watch?v=AAAAAAAAAAA&list=PLdemo">Clickbait  displayed title!</a></h3></ytd-rich-grid-media>
<ytd-video-renderer id="search"><a id="thumbnail" href="/watch?v=BBBBBBBBBBB"><img src="https://i.ytimg.com/vi/BBBBBBBBBBB/hqdefault.jpg"></a><h3><a id="video-title" href="/watch?v=BBBBBBBBBBB">Irrelevant title</a></h3></ytd-video-renderer>
<ytd-grid-video-renderer id="channel"><a href="/watch?v=CCCCCCCCCCC"><img src="https://i.ytimg.com/vi/CCCCCCCCCCC/hqdefault.jpg"></a><a id="video-title" href="/watch?v=CCCCCCCCCCC">Sensational title</a></ytd-grid-video-renderer>
<ytd-compact-video-renderer id="recommendation"><a href="/watch?v=DDDDDDDDDDD"><img src="https://i.ytimg.com/vi/DDDDDDDDDDD/hqdefault.jpg"></a><h3><a id="video-title" href="/watch?v=DDDDDDDDDDD">Valid title</a></h3></ytd-compact-video-renderer>
<ytd-playlist-video-renderer id="playlist-entry"><a href="/watch?v=EEEEEEEEEEE&list=PLdemo&index=2"><img src="https://i.ytimg.com/vi/EEEEEEEEEEE/hqdefault.jpg"></a><h3><a id="video-title" href="/watch?v=EEEEEEEEEEE&list=PLdemo">Valid playlist entry</a></h3></ytd-playlist-video-renderer>
<yt-lockup-view-model id="modern"><a class="ytLockupViewModelImage" href="/watch?v=FFFFFFFFFFF"><yt-thumbnail-view-model><img src="https://i.ytimg.com/vi/FFFFFFFFFFF/hqdefault.jpg"></yt-thumbnail-view-model></a><yt-lockup-metadata-view-model><h3 class="ytLockupMetadataViewModelHeadingReset" title="Valid modern title"><a class="ytLockupMetadataViewModelTitle" href="/watch?v=FFFFFFFFFFF" aria-label="Native modern metadata"><span>Valid modern title</span></a></h3></yt-lockup-metadata-view-model></yt-lockup-view-model>
<ytd-reel-item-renderer id="legacy-shorts"><a href="/shorts/GGGGGGGGGGG"><img src="https://i.ytimg.com/vi/GGGGGGGGGGG/hqdefault.jpg"></a><h3><a id="video-title" href="/shorts/GGGGGGGGGGG">Valid legacy Shorts</a></h3></ytd-reel-item-renderer>
<ytm-shorts-lockup-view-model-v2 class="shortsLockupViewModelHost"><ytm-shorts-lockup-view-model id="shorts" class="shortsLockupViewModelHost"><a class="shortsLockupViewModelHostEndpoint" href="/shorts/HHHHHHHHHHH"><yt-thumbnail-view-model><img src="https://i.ytimg.com/vi/HHHHHHHHHHH/oardefault.jpg?actual=1"></yt-thumbnail-view-model></a><h3 class="shortsLockupViewModelHostMetadataTitle"><a href="/shorts/HHHHHHHHHHH" title="Valid modern Shorts"><span>Valid modern Shorts</span></a></h3></ytm-shorts-lockup-view-model></ytm-shorts-lockup-view-model-v2>
<yt-lockup-view-model id="collection"><a href="/watch?v=IIIIIIIIIII&list=PLdemo"><yt-collection-thumbnail-view-model><img src="https://i.ytimg.com/vi/IIIIIIIIIII/hqdefault.jpg"></yt-collection-thumbnail-view-model></a><h3 class="yt-lockup-metadata-view-model__title"><a href="/playlist?list=PLdemo">Playlist collection title</a></h3></yt-lockup-view-model>
<ytd-video-renderer id="channel-only"><a href="/@channel"><img src="https://i.ytimg.com/avatar.jpg"></a><h3><a id="video-title" href="/@channel">Channel title</a></h3></ytd-video-renderer>
<ytd-ad-slot-renderer><ytd-rich-grid-media id="ad"><a href="/watch?v=JJJJJJJJJJJ"><img src="https://i.ytimg.com/vi/JJJJJJJJJJJ/hqdefault.jpg"></a><a id="video-title" href="/watch?v=JJJJJJJJJJJ">Ad title</a></ytd-rich-grid-media></ytd-ad-slot-renderer>
</body></html>
